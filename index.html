<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ward Callings Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#1B2636; --ink-2:#465367; --muted:#768297;
  --line:#D6DCE5; --line-2:#C3CBD7;
  --accent:#2C5F83; --accent-ink:#FFFFFF; --accent-soft:#E0EBF4;
  --prop:#94590B; --prop-soft:#FBEFD9; --prop-line:#E9C88F;
  --rel:#A33A2F; --rel-soft:#F8E2DF;
  --ok:#2E6A43; --ok-soft:#DFF0E4;
  --shadow:0 1px 2px rgba(20,32,50,.06),0 4px 14px rgba(20,32,50,.06);
  --ghost-shadow:0 10px 28px rgba(20,32,50,.25);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141B; --surface:#161D27; --surface-2:#1E2733; --ink:#E5EAF1; --ink-2:#B1BBC9; --muted:#8290A3;
    --line:#2A3544; --line-2:#394658;
    --accent:#86B8DC; --accent-ink:#0F141B; --accent-soft:#1B3044;
    --prop:#E7B460; --prop-soft:#352812; --prop-line:#6B5020;
    --rel:#EC8E82; --rel-soft:#3A1E1B;
    --ok:#80C998; --ok-soft:#18311F;
    --shadow:0 1px 2px rgba(0,0,0,.3); --ghost-shadow:0 10px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141B; --surface:#161D27; --surface-2:#1E2733; --ink:#E5EAF1; --ink-2:#B1BBC9; --muted:#8290A3;
  --line:#2A3544; --line-2:#394658;
  --accent:#86B8DC; --accent-ink:#0F141B; --accent-soft:#1B3044;
  --prop:#E7B460; --prop-soft:#352812; --prop-line:#6B5020;
  --rel:#EC8E82; --rel-soft:#3A1E1B;
  --ok:#80C998; --ok-soft:#18311F;
  --shadow:0 1px 2px rgba(0,0,0,.3); --ghost-shadow:0 10px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding:0 16px 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -16px;padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font:600 22px/1.1 var(--serif);letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.live::before{background:var(--ok)}
.sync.ro::before{background:var(--prop)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.stats b{font:500 14px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.stats .pend b{color:var(--prop)}
.tools{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:6px 10px;width:200px;max-width:100%}

/* layout */
.layout{display:grid;gap:20px;padding-top:18px;grid-template-columns:1fr}
@media (min-width:860px){
  .layout{grid-template-columns:270px minmax(0,1fr)}
  .people{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);grid-row:span 2}
  .changes{grid-column:2}
}
@media (min-width:1320px){
  .layout{grid-template-columns:270px minmax(0,1fr) 330px}
  .people{grid-row:auto}
  .changes{grid-column:3;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.panel-h h2{font:600 17px var(--serif)}
.count{font:500 12px var(--mono);color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* people */
.people{display:flex;flex-direction:column;min-height:0;max-height:85vh}
.people-tools{display:flex;flex-direction:column;gap:8px;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.people-tools .search{width:100%}
.people-tools .seg{align-self:flex-start}
.plist{list-style:none;margin:0;padding:6px 8px;overflow:auto;flex:1;min-height:45vh}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:2px 6px;padding:6px;border-radius:8px}
.person:hover{background:var(--surface-2)}
.person .meta{grid-column:1/-1;font-size:12px;color:var(--muted);padding-left:2px;line-height:1.35}
.person .meta .p{color:var(--prop)}
.pact{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.person:hover .pact,.person:focus-within .pact{opacity:1}
@media (hover:none){.pact{opacity:1}}
.mini{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:5px}
.mini:hover{background:var(--line);color:var(--ink)}
.mini.armed{background:var(--rel);color:#fff}
.addwrap{border-top:1px solid var(--line)}
.addwrap summary{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);list-style:none}
.addwrap summary::-webkit-details-marker{display:none}
.addwrap summary::before{content:"+ "}
.addwrap[open] summary::before{content:"− "}
.add-people{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.add-people textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:7px 9px}
.sample-note{margin:0 14px 10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger.armed{background:var(--rel);border-color:var(--rel);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13.5px;line-height:1.3;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--accent)}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip.new{background:var(--prop-soft);border-color:var(--prop-line);color:var(--ink)}
.chip.out .nm{text-decoration:line-through;text-decoration-color:var(--rel);color:var(--ink-2)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.chip.src{opacity:.35}
.chip .x{border:0;background:none;padding:0 2px;margin-right:-3px;font-size:15px;line-height:1;color:var(--muted);cursor:pointer}
.chip .x:hover{color:var(--rel)}
.tagx{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
body.dragging,body.dragging *{cursor:grabbing!important}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;padding:5px 11px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--ghost-shadow);transform:translate(-50%,-130%);white-space:nowrap}

/* board */
.board{display:flex;flex-direction:column;gap:18px;min-width:0}
.colhead{display:grid;grid-template-columns:var(--cols);gap:10px;padding:0 14px}
.org{overflow:hidden}
.org-h{display:flex;align-items:baseline;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.org-toggle{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.org-name{font:600 18px var(--serif)}
.chev{display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
.org.collapsed .chev{transform:rotate(-90deg)}
.org.collapsed .rows,.org.collapsed .addrow{display:none}
.org.collapsed .org-h{border-bottom:0}
.boardtools{display:flex;gap:14px;justify-content:flex-end;padding:0 4px}
.org-h .count{margin-right:auto}
.rows{display:flex;flex-direction:column}
:root{--cols:minmax(150px,1.05fr) minmax(0,1fr) 14px minmax(0,1fr) minmax(128px,auto)}
.row{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row.is-pending{background:linear-gradient(90deg,var(--prop-soft),transparent 55%)}
.row.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.title{min-width:0}
.tbtn{border:0;background:none;padding:2px 0;text-align:left;font-weight:600;color:var(--ink);cursor:text;max-width:100%}
.tbtn:hover{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.arrow{color:var(--muted);text-align:center}
.slot{min-height:34px;display:flex;align-items:center;gap:6px;padding:2px 4px;margin:-2px -4px;border-radius:8px;border:1.5px dashed transparent;min-width:0;flex-wrap:wrap}
.ph{font-size:12.5px;color:var(--muted)}
.ph.vac{color:var(--rel);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.typebtn{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);cursor:text;text-decoration:underline dotted;text-underline-offset:3px}
.typebtn:hover{color:var(--accent)}
.edit.typein{width:100%;flex-wrap:nowrap;gap:4px}
.edit.typein input{min-width:0;flex:1 1 60px;padding:4px 6px}
.edit.typein .mini{padding:2px 4px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
body.dragging .slot,body.picking .slot{border-color:var(--line-2)}
body.picking .slot{cursor:pointer}
.slot.over,body.picking .slot:hover{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.people.over{outline:2px solid var(--rel);outline-offset:-2px}
.state{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.pill{border:1px solid transparent;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.s-proposed{background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2)}
.pill.s-approved{background:var(--accent-soft);color:var(--accent)}
.pill.s-extended,.pill.s-accepted{background:var(--prop-soft);color:var(--prop);border-color:var(--prop-line)}
.pill.s-sustained{background:var(--ok-soft);color:var(--ok)}
.pill.s-setapart{background:var(--ok);color:var(--surface)}
.apply{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;font-size:12px;font-weight:600;padding:2px 8px;color:var(--ink-2)}
.apply:hover{border-color:var(--ok);color:var(--ok)}
.rel-tag{font-size:12px;font-weight:700;color:var(--rel);background:var(--rel-soft);padding:3px 8px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.rel-tag .x{border:0;background:none;padding:0;color:inherit;font-size:15px;line-height:1}
.edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edit input{flex:1;min-width:120px;border:1px solid var(--accent);border-radius:6px;padding:4px 8px;background:var(--surface)}
.addrow{padding:8px 14px 12px}
.addbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.neworg{padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.neworg input{border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;background:var(--bg);flex:1;min-width:150px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.empty h2{font:600 20px var(--serif);margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 14px}

@media (max-width:640px){
  :root{--cols:1fr}
  .colhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);grid-template-areas:"t t t" "c a p" "s s s";row-gap:6px}
  .row .title{grid-area:t}.row .cur{grid-area:c}.row .arrow{grid-area:a}.row .prop{grid-area:p}.row .state{grid-area:s;justify-content:flex-start}
  .row .state:empty{display:none}
  .tools{margin-left:0;width:100%}
  .search{flex:1}
}

/* changes */
.changes .sec{padding:4px 14px 14px;border-top:1px solid var(--line)}
.changes .sec:first-of-type{border-top:0}
.changes h3{margin:12px 0 6px}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.citem{border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;background:var(--surface)}
.citem:hover{border-color:var(--accent)}
.cl{display:flex;gap:6px;align-items:baseline;font-size:13px}
.cl b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;min-width:52px}
.cl.call b{color:var(--ok)}
.cl.rl b{color:var(--rel)}
.cl .where{color:var(--muted);font-size:12px}
.note{font-size:12.5px;color:var(--ink-2);padding:6px 9px;border-radius:7px;background:var(--prop-soft);border:1px solid var(--prop-line)}
.script{width:100%;min-height:150px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:8px;font:12.5px/1.5 var(--sans);resize:vertical;margin-top:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.muted{color:var(--muted);font-size:13px;margin:4px 0 0}

/* bottom picking bar & toast */
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 12px 9px 16px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--ghost-shadow);max-width:calc(100% - 32px);font-size:13px}
.pickbar button{border:1px solid currentColor;background:none;color:inherit;border-radius:6px;padding:3px 10px;font-weight:600}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:var(--ghost-shadow);max-width:min(360px,calc(100% - 32px))}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate-card{width:100%;max-width:340px;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate-card h2{font:600 24px var(--serif)}
.gate-card p{margin:0;color:var(--ink-2)}
.gate-card input{font-size:22px;text-align:center;letter-spacing:.3em;padding:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
.gate-card .btn{padding:10px;font-size:15px}
.gate-err{color:var(--rel)!important;min-height:1.2em;font-size:13px}
.import{margin-top:14px;text-align:left;max-width:52ch;margin-inline:auto}
.import textarea{width:100%;min-height:90px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);padding:8px;font:12px var(--mono)}
.backup{padding:0 14px 12px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Ward Callings</h1><span class="sync" id="sync">Connecting…</span></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <div class="seg" id="viewSeg" role="group" aria-label="Show">
      <button type="button" data-view="all" aria-pressed="true">All</button>
      <button type="button" data-view="changes" aria-pressed="false">Changes</button>
      <button type="button" data-view="vacant" aria-pressed="false">Vacant</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search callings or names" aria-label="Search callings or names">
  </div>
</header>

<main class="layout">
  <aside class="panel people" id="people" data-drop="unassign" aria-label="Members">
    <div class="panel-h"><h2>Members</h2><span class="count" id="pcount"></span></div>
    <div id="sampleNote"></div>
    <div class="people-tools">
      <input class="search" id="pq" type="search" placeholder="Find a member" aria-label="Find a member">
      <div class="seg" id="pSeg" role="group" aria-label="Filter members">
        <button type="button" data-pf="all" aria-pressed="true">All</button>
        <button type="button" data-pf="free" aria-pressed="false">No calling</button>
        <button type="button" data-pf="pending" aria-pressed="false">Proposed</button>
      </div>
    </div>
    <ul class="plist" id="plist"></ul>
    <details class="addwrap" id="addWrap">
    <summary>Add members</summary>
    <form class="add-people" id="addPeople">
      <label class="eyebrow" for="newNames">One name per line</label>
      <textarea id="newNames" placeholder="One name per line"></textarea>
      <button class="btn" type="submit">Add to list</button>
    </form>
    <p class="backup"><button class="linkbtn" type="button" data-act="copy-data">Copy board data</button> to back it up or move it to another board.</p>
    </details>
  </aside>

  <section class="board" id="board" aria-label="Callings"></section>

  <aside class="panel changes" id="changes" aria-label="Pending changes"></aside>
</main>

<div class="gate" id="gate" hidden>
  <form class="panel gate-card" id="gateForm">
    <h2>Ward Callings</h2>
    <p>Enter the ward PIN. You only need to do this once on this phone.</p>
    <input id="gatePin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="Ward PIN">
    <button class="btn primary" type="submit">Open board</button>
    <p class="gate-err" id="gateErr" role="alert"></p>
  </form>
</div>

<div class="ghost" id="ghost" hidden></div>
<div class="pickbar" id="pickbar" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const TEMPLATE=[
 ["Bishopric",["Bishop","First Counselor","Second Counselor","Executive Secretary","Assistant Executive Secretary","Ward Clerk","Assistant Clerk – Membership","Assistant Clerk – Finance"]],
 ["Elders Quorum",["President","First Counselor","Second Counselor","Secretary","Instructor","Instructor"]],
 ["Relief Society",["President","First Counselor","Second Counselor","Secretary","Teacher","Teacher","Compassionate Service Coordinator"]],
 ["Aaronic Priesthood",["Priests Quorum Adviser","Teachers Quorum Adviser","Deacons Quorum Adviser","Young Men Specialist"]],
 ["Young Women",["President","First Counselor","Second Counselor","Secretary","Class Adviser","Class Adviser","Young Women Specialist"]],
 ["Primary",["President","First Counselor","Second Counselor","Secretary","Music Leader","Pianist","Nursery Leader","Nursery Leader","Sunbeam Teacher","CTR 5 Teacher","CTR 6 Teacher","CTR 7 Teacher","Valiant 8 Teacher","Valiant 9 Teacher","Valiant 10–11 Teacher"]],
 ["Sunday School",["President","First Counselor","Second Counselor","Secretary","Gospel Doctrine Teacher","Gospel Doctrine Teacher","Youth Sunday School Teacher","Youth Sunday School Teacher"]],
 ["Missionary & Temple",["Ward Mission Leader","Ward Missionary","Ward Missionary","Temple & Family History Leader","Temple & Family History Consultant"]],
 ["Music",["Music Coordinator","Chorister","Organist","Choir Director","Choir Accompanist"]],
 ["Ward Support",["Activities Committee Chair","Building Representative","Emergency Preparedness Specialist","Communication Specialist","Self-Reliance Specialist"]]
];
const STANDALONE_ORGS=new Set(["Bishopric","Aaronic Priesthood","Aaronic Priesthood Quorums","Missionary & Temple","Ward Missionaries","Temple and Family History","Young Single Adult","Music","Ward Support","Other Callings","Stake & Temple"]);
const STATUSES=[["proposed","Proposed"],["approved","Approved"],["extended","Extended"],["accepted","Accepted"],["sustained","Sustained"],["setapart","Set apart"]];
const STATUS_HINT={proposed:"Discussed, not yet approved",approved:"Approved in bishopric meeting",extended:"Calling extended",accepted:"Accepted, ready to sustain",sustained:"Sustained in sacrament meeting",setapart:"Set apart, ready to record"};
const LS="ward-callings-v1";

const $=s=>document.querySelector(s);
function loadCollapsed(){try{return new Set(JSON.parse(localStorage.getItem("ward-callings-collapsed")||"[]"));}catch(e){return new Set();}}
function saveCollapsed(){try{localStorage.setItem("ward-callings-collapsed",JSON.stringify([...state.collapsed]));}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={people:new Map(),callings:new Map(),view:"all",q:"",pq:"",pf:"all",selected:null,editing:null,collapsed:loadCollapsed(),ready:false,mode:"loading",readOnly:false,flash:null};

/* ---------- storage: the Ward Callings Apps Script (PIN-protected JSON API) ---------- */
// Body is sent as text/plain so the browser makes a "simple" request (no CORS preflight).
const API_URL="https://script.google.com/macros/s/AKfycbzEzQI1HQUs0n0rYxhMgklRVVOF7Ztdk5hWFiNyjn6jAW0uWuFhnUoe3xWexyDDPI9M/exec";
const PIN_KEY="ward-callings-pin";
let pin=null,rev=0,pending=[],flushing=false,flushTimer=0,loading=false;
function getPin(){try{return localStorage.getItem(PIN_KEY);}catch(e){return null;}}
function savePin(p){try{p?localStorage.setItem(PIN_KEY,p):localStorage.removeItem(PIN_KEY);}catch(e){}}
async function api(fn,args){
  let r;
  try{r=await fetch(API_URL,{method:"POST",body:JSON.stringify({fn,args:args||[],pin}),redirect:"follow"});}
  catch(e){throw{code:"net",message:"No connection"};}
  if(!r.ok)throw{code:"net",message:"Server error "+r.status};
  let j;try{j=await r.json();}catch(e){throw{code:"net",message:"Unexpected reply"};}
  if(!j.ok)throw{code:j.code||"error",message:j.error||"Something went wrong"};
  return j.result;
}
function apiFailed(err){
  if(err&&(err.code==="pin"||err.code==="locked")){savePin(null);showGate(err.message);return;}
  toast(err&&err.code==="net"?"Can't reach the board. Check your connection; your last change may not have saved.":"A change didn't save: "+(err&&err.message||"unknown error"));
  loadAll().catch(()=>{});
}
async function loadAll(){
  loading=true;
  try{
    const all=await api("getAll");
    if(pending.length||flushing)return;             // our own writes are still on their way
    state.people=new Map(Object.entries(all.people||{}));
    state.callings=new Map(Object.entries(all.callings||{}));
    rev=all.rev||0;state.ready=true;state.mode="shared";
    scheduleRender();
  }finally{loading=false;}
}
function put(col,id,body){
  const map=col==="people"?state.people:state.callings;
  if(body)map.set(id,body);else map.delete(id);
  pending.push({col,id,body:body||null});
  clearTimeout(flushTimer);flushTimer=setTimeout(flush,250);
}
async function flush(){
  if(flushing||!pending.length)return;
  flushing=true;
  const byKey=new Map();pending.forEach(w=>byKey.set(w.col+"/"+w.id,w));pending=[];
  try{rev=await api("batch",[[...byKey.values()]]);}
  catch(err){flushing=false;apiFailed(err);return;}
  flushing=false;
  if(pending.length)flush();
}
async function poll(){
  if(!pin||!state.ready||pending.length||flushing||loading||document.visibilityState!=="visible")return;
  try{const r=await api("getRev");if(r!==rev)await loadAll();}
  catch(err){if(err&&(err.code==="pin"||err.code==="locked"))apiFailed(err);}
}
setInterval(poll,10000);
document.addEventListener("visibilitychange",poll);
function newId(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function patchCalling(id,patch){const c=state.callings.get(id);if(!c)return;put("callings",id,{...c,...patch,updated:Date.now()});}
function exportData(){return JSON.stringify({people:Object.fromEntries(state.people),callings:Object.fromEntries(state.callings)});}
function importData(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast("That text isn't board data. Copy it again from the old board.");return false;}
  const ppl=Object.entries(o.people||{}),cal=Object.entries(o.callings||{});
  if(!cal.length&&!ppl.length){toast("No members or callings found in that text.");return false;}
  ppl.forEach(([id,b])=>put("people",id,b));cal.forEach(([id,b])=>put("callings",id,b));
  toast(`Imported ${ppl.length} members and ${cal.length} callings.`);render();return true;
}

/* ---------- PIN screen ---------- */
function showGate(msg){
  $("#gate").hidden=false;$("#gateErr").textContent=msg||"";
  const i=$("#gatePin");i.value="";setTimeout(()=>i.focus(),50);
}
$("#gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=$("#gatePin").value.trim();if(!v)return;

  catch(err){$("#gateErr").textContent=err&&err.code==="net"?"Can't reach the board. Check your connection and try again.":(err&&err.message)||"That didn't work.";}

});

/* ---------- helpers ---------- */
const fullName=pid=>(state.people.get(pid)||{}).name||"Removed member";
// Display names: first name plus surname initial, no full stop ("Stephen A"). If two
// people would still match, add surname letters until they differ ("Sam Wh", "Sam Wi").
let shortNames=new Map();
function buildShort(){
  const rows=[];
  for(const[id,p]of state.people){
    const parts=String(p.name||"").trim().split(/\s+/);
    const first=p.first||parts[0]||"";
    const last=String(p.last||(parts.length>1?parts[parts.length-1]:"")).replace(/\s+/g,"");
    rows.push({id,first,last});
  }
  const label=(r,n)=>(r.first+(r.last?" "+r.last.slice(0,n):"")).trim();
  shortNames=new Map();
  for(const r of rows){
    let n=1;
    while(n<r.last.length&&rows.some(o=>o!==r&&label(o,n).toLowerCase()===label(r,n).toLowerCase()))n++;
    shortNames.set(r.id,label(r,n));
  }
}
const nameOf=pid=>shortNames.get(pid)||fullName(pid);
const lastName=n=>{const p=String(n).trim().split(/\s+/);return (p[p.length-1]+" "+p.join(" ")).toLowerCase();};
const isPending=c=>!!(c.proposed||(c.release&&c.current));
const fullTitle=c=>STANDALONE_ORGS.has(c.org)||c.title.toLowerCase().includes(c.org.toLowerCase())?c.title:c.org+" "+c.title;
function sorted(){return[...state.callings.entries()].sort((a,b)=>((a[1].orgOrder??99)-(b[1].orgOrder??99))||String(a[1].org).localeCompare(b[1].org)||((a[1].order??0)-(b[1].order??0)));}
function index(){
  const cur=new Map(),prop=new Map(),after=new Map();
  const push=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v);};
  for(const[id,c]of state.callings){
    if(c.current)push(cur,c.current,id);
    if(c.proposed)push(prop,c.proposed,id);
    const fin=c.release?null:(c.proposed||c.current);
    if(fin)push(after,fin,id);
  }
  return{cur,prop,after};
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200);}
function scheduleRender(){if(state.editing){pendingRender=true;return;}cancelAnimationFrame(rafId);rafId=requestAnimationFrame(render);}
function sameSrc(a,b){return a&&b&&a.pid===b.pid&&a.from===b.from&&(a.cid||null)===(b.cid||null);}

/* ---------- render ---------- */
function render(){
  pendingRender=false;

}

function chip(pid,from,cid,cls=""){

}
function renderPeople(ix){
  const list=[...state.people.entries()].sort((a,b)=>lastName(a[1].name).localeCompare(lastName(b[1].name)));
  $("#pcount").textContent=list.length+" people";

function statusPill(cid,c){
  const s=c.status||"proposed";const lbl=(STATUSES.find(x=>x[0]===s)||STATUSES[0])[1];
  return state.readOnly?`<span class="pill s-${s}">${lbl}</span>`:`<button class="pill s-${s}" type="button" data-act="status" data-cid="${cid}" title="${esc(STATUS_HINT[s])} — click to advance">${lbl}</button>`;
}
function renderBoard(ix){
  const board=$("#board");
  if(!state.ready){board.innerHTML=`<div class="panel empty"><p>Loading the board…</p></div>`;return;}
  if(!state.callings.size){
    board.innerHTML=`<div class="panel empty"><h2>No callings yet</h2><p>Start from the standard list of ward callings, then rename, add, or remove callings to match your ward.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" type="button" data-act="template">Add standard ward callings</button></div><div class="import"><label class="eyebrow" for="importText">Or paste board data copied from the old board</label><textarea id="importText" placeholder='{"people":{...},"callings":{...}}'></textarea><div class="btnrow"><button class="btn" type="button" data-act="import">Import</button></div></div></div>`;
    return;
  }
  const q=state.q.trim().toLowerCase();
  const groups=new Map();
  for(const[id,c]of sorted()){
    if(!groups.has(c.org))groups.set(c.org,{orgOrder:c.orgOrder,items:[],all:0,filled:0,pend:0});
    const g=groups.get(c.org);g.all++;if(c.current)g.filled++;if(isPending(c))g.pend++;
    if(state.view==="changes"&&!isPending(c))continue;
    if(state.view==="vacant"&&c.current)continue;
    if(q){const hay=[c.title,c.org,c.current&&fullName(c.current),c.proposed&&fullName(c.proposed)].join(" ").toLowerCase();if(!hay.includes(q))continue;}
    g.items.push([id,c]);
  }
  const filtering=state.view!=="all"||q;
  let html=`<div class="colhead eyebrow" aria-hidden="true"><span>Calling</span><span>Current</span><span></span><span>Proposed</span><span style="text-align:right">Status</span></div>`;
  let shown=0;
  if(!filtering)html+=`<div class="boardtools"><button class="linkbtn" type="button" data-act="expand-all">Expand all</button><button class="linkbtn" type="button" data-act="collapse-all">Collapse all</button></div>`;
  for(const[org,g]of groups){
    if(filtering&&!g.items.length)continue;
    shown+=g.items.length;
    const col=!filtering&&state.collapsed.has(org);
    html+=`<section class="panel org${col?" collapsed":""}"><div class="org-h"><button class="org-toggle" type="button" data-act="toggle-org" data-org="${esc(org)}" aria-expanded="${!col}"><span class="chev" aria-hidden="true">▾</span><span class="org-name">${esc(org)}</span></button><span class="count">${g.filled}/${g.all} filled</span>${g.pend?`<span class="pill s-extended">${g.pend} pending</span>`:""}</div><div class="rows">`;
    for(const[id,c]of g.items)html+=rowHTML(id,c);
    if(state.editing&&state.editing.type==="new"&&state.editing.org===org){
      html+=`<div class="row"><div class="edit" style="grid-column:1/-1"><input id="edit-new" placeholder="Calling title" aria-label="New calling title"><button class="mini" type="button" data-act="save">Add</button><button class="mini" type="button" data-act="cancel">Cancel</button></div></div>`;
    }
    html+=`</div>${state.readOnly||filtering?"":`<div class="addrow"><button class="addbtn" type="button" data-act="add-calling" data-org="${esc(org)}">+ Add calling</button></div>`}</section>`;
  }
  if(filtering&&!shown)html+=`<div class="panel empty"><p>${state.view==="changes"?"No pending changes. Drag a name into the Proposed column to start one.":state.view==="vacant"?"Every calling is filled.":"Nothing matches your search."}</p></div>`;
  if(!filtering&&!state.readOnly)html+=`<form class="panel neworg" id="newOrg"><span class="eyebrow">New organization</span><input id="newOrgName" placeholder="Organization name" aria-label="Organization name"><input id="newOrgFirst" placeholder="First calling" aria-label="First calling"><button class="btn" type="submit">Add</button></form>`;
  html+=`<datalist id="memberList">${[...state.people.keys()].map(pid=>nameOf(pid)).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>`;

}
function rowHTML(id,c){

  }
  const pend=isPending(c);
  const replacing=c.current&&(c.release||c.proposed);
  const cur=c.current?chip(c.current,"current",id,replacing?"out":""):`<span class="ph vac">Vacant</span>`;
  let prop;
  if(c.proposed)prop=chip(c.proposed,"proposed",id,"new");
  else if(c.release&&c.current)prop=`<span class="rel-tag">Release${state.readOnly?"":`<button class="x" type="button" data-act="clear" data-cid="${id}" aria-label="Cancel release">×</button>`}</span>`;
  else if(state.editing&&state.editing.type==="propose"&&state.editing.id===id)prop=`<div class="edit typein"><input id="edit-propose" list="memberList" placeholder="Start typing a name" autocomplete="off" aria-label="Proposed name for ${esc(c.title)}"><button class="mini" type="button" data-act="save">Add</button><button class="mini" type="button" data-act="cancel">Cancel</button></div>`;
  else prop=`<span class="ph">${state.readOnly?"—":`<button class="typebtn" type="button" data-act="type-name" data-cid="${id}">Type or drop a name</button>`}${c.current&&!state.readOnly?` · <button class="linkbtn" type="button" data-act="release" data-cid="${id}">Release</button>`:""}</span>`;
  const st=pend?statusPill(id,c)+(state.readOnly?"":`<button class="apply" type="button" data-act="apply" data-cid="${id}" title="Record this change as done">Record</button>`):"";
  return `<div class="row${pend?" is-pending":""}" data-cid="${id}">
    <div class="title">${state.readOnly?`<strong>${esc(c.title)}</strong>`:`<button class="tbtn" type="button" data-act="edit-calling" data-cid="${id}" title="Rename or delete">${esc(c.title)}</button>`}</div>
    <div class="slot cur" data-drop="current" data-cid="${id}" aria-label="Current ${esc(c.title)}">${cur}</div>
    <div class="arrow" aria-hidden="true">→</div>
    <div class="slot prop" data-drop="proposed" data-cid="${id}" aria-label="Proposed ${esc(c.title)}">${prop}</div>
    <div class="state">${st}</div></div>`;
}
function renderChanges(ix){
  const el=$("#changes");

  let html=`<div class="panel-h"><h2>Pending changes</h2><span class="count">${items.length}</span></div>`;
  if(!items.length){el.innerHTML=html+`<div class="sec"><p class="muted">Nothing proposed yet. Drag a member into a calling's Proposed slot, or choose Release on a filled calling.</p></div>`;return;}
  const notes=[];
  for(const[pid,cids]of ix.prop)if(cids.length>1)notes.push(`${esc(nameOf(pid))} is proposed for ${cids.length} callings.`);
  for(const[pid,cids]of ix.after){
    if(cids.length>1&&ix.prop.has(pid)){
      const keep=cids.filter(cid=>state.callings.get(cid).current===pid).map(cid=>esc(fullTitle(state.callings.get(cid))));
      if(keep.length)notes.push(`${esc(nameOf(pid))} would still serve as ${keep.join(", ")}. Add a release if that's intended.`);
    }
  }
  if(notes.length)html+=`<div class="sec"><h3 class="eyebrow">Check</h3><div class="clist">${notes.map(n=>`<div class="note">${n}</div>`).join("")}</div></div>`;
  for(const[s,label]of STATUSES){
    const grp=items.filter(([,c])=>(c.status||"proposed")===s);
    if(!grp.length)continue;
    html+=`<div class="sec"><h3 class="eyebrow">${label} · ${grp.length}</h3><ul class="clist">`;
    for(const[id,c]of grp){
      const t=esc(fullTitle(c));
      let lines="";
      if(c.proposed)lines+=`<div class="cl call"><b>Call</b><span>${esc(nameOf(c.proposed))} <span class="where">${t}</span></span></div>`;
      if(c.current&&(c.release||c.proposed))lines+=`<div class="cl rl"><b>Release</b><span>${esc(nameOf(c.current))} <span class="where">${t}</span></span></div>`;
      html+=`<li class="citem" data-act="goto" data-cid="${id}" tabindex="0">${lines}</li>`;
    }
    html+=`</ul>`;
    if(s==="accepted"){
      html+=`<textarea class="script" id="script" readonly aria-label="Sustaining script">${esc(script(grp.map(x=>x[1])))}</textarea><div class="btnrow"><button class="btn primary" type="button" data-act="copy">Copy sustaining script</button>${state.readOnly?"":`<button class="btn" type="button" data-act="mark-sustained">Mark all sustained</button>`}</div>`;
    }
    if(s==="setapart"&&!state.readOnly)html+=`<div class="btnrow"><button class="btn primary" type="button" data-act="record-all">Record all as current</button></div>`;
    html+=`</div>`;
  }
  el.innerHTML=html;
}
function script(cs){
  const rel=cs.filter(c=>c.current&&(c.release||c.proposed)).map(c=>`  • ${fullName(c.current)} as ${fullTitle(c)}`);
  const call=cs.filter(c=>c.proposed).map(c=>`  • ${fullName(c.proposed)} as ${fullTitle(c)}`);
  let t="";
  if(rel.length)t+=`The following have been released:\n${rel.join("\n")}\nAll who wish to join us in thanking them for their service may do so by the uplifted hand.\n\n`;
  if(call.length)t+=`The following have been called, and we ask them to stand as their names are read:\n${call.join("\n")}\nThose in favor of sustaining them may manifest it by the uplifted hand. Those opposed, if any, may manifest it.`;
  return t.trim();
}

/* ---------- actions ---------- */
function doDrop(src,tgt){
  if(state.readOnly){toast("You can view this board but not change it.");return;}
  const {pid,from,cid:scid}=src;
  if(tgt.kind==="unassign"){
    if(from==="proposed")patchCalling(scid,{proposed:null,status:null,release:false});
    else if(from==="current"){patchCalling(scid,{release:true,proposed:null,status:"proposed"});toast(`${nameOf(pid)} marked for release.`);}
    return;
  }
  const c=state.callings.get(tgt.cid);if(!c)return;
  if(tgt.kind==="proposed"){
    if(from==="proposed"&&scid===tgt.cid)return;
    if(c.current===pid){toast(`${nameOf(pid)} already serves as ${c.title}.`);return;}
    if(c.proposed===pid)return;
    patchCalling(tgt.cid,{proposed:pid,release:false,status:"proposed"});
    if(from==="proposed"&&scid!==tgt.cid)patchCalling(scid,{proposed:null,status:null,release:false});
  }else if(tgt.kind==="current"){
    if(c.current===pid&&from!=="proposed")return;
    const patch={current:pid};
    if(c.proposed===pid)Object.assign(patch,{proposed:null,status:null,release:false});
    if(c.release&&c.current!==pid)patch.release=false;
    patchCalling(tgt.cid,patch);
    if(scid&&scid!==tgt.cid){
      if(from==="current")patchCalling(scid,{current:null,release:false});
      if(from==="proposed")patchCalling(scid,{proposed:null,status:null,release:false});
    }
  }
  state.selected=null;
}
function recordCalling(id){
  const c=state.callings.get(id);if(!c)return;
  patchCalling(id,{current:c.release?null:c.proposed||c.current,proposed:null,release:false,status:null});
}
async function addTemplate(){
  let oi=0;
  for(const[org,titles]of TEMPLATE){
    titles.forEach((t,i)=>put("callings",newId(),{title:t,org,orgOrder:oi,order:i,current:null,proposed:null,release:false,status:null,updated:Date.now()}));
    oi++;
  }
  scheduleRender();
}
function removePerson(pid){
  for(const[id,c]of state.callings){
    const patch={};
    if(c.current===pid){patch.current=null;patch.release=false;}
    if(c.proposed===pid){patch.proposed=null;if(!c.release)patch.status=null;}
    if(Object.keys(patch).length)patchCalling(id,patch);
  }
  put("people",pid,null);
}
function arm(btn,label,fn){
  if(btn.classList.contains("armed")){fn();return;}
  btn.classList.add("armed");const old=btn.textContent;btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=old;}},3500);
}
function commitEdit(){
  const e=state.editing;if(!e)return;
  state.editing=null;
  if(e.type==="calling"){const v=($("#edit-calling")||{}).value;if(v&&v.trim()&&v.trim()!==state.callings.get(e.id)?.title)patchCalling(e.id,{title:v.trim()});}
  if(e.type==="person"){const v=($("#edit-person")||{}).value;const p=state.people.get(e.id);if(p&&v&&v.trim()&&v.trim()!==p.name)put("people",e.id,{...p,name:v.trim()});}
  if(e.type==="propose"){const v=(($("#edit-propose")||{}).value||"").trim();if(v)proposeTyped(e.id,v);}
  if(e.type==="new"){const v=($("#edit-new")||{}).value;if(v&&v.trim()){const sib=[...state.callings.values()].filter(c=>c.org===e.org);put("callings",newId(),{title:v.trim(),org:e.org,orgOrder:sib[0]?.orgOrder??99,order:Math.max(-1,...sib.map(c=>c.order??0))+1,current:null,proposed:null,release:false,status:null,updated:Date.now()});}}
  render();
}
function proposeTyped(cid,typed){
  const t=typed.toLowerCase();
  const ids=[...state.people.keys()];
  let pid=ids.find(id=>nameOf(id).toLowerCase()===t)||ids.find(id=>fullName(id).toLowerCase()===t);
  if(!pid){const byFirst=ids.filter(id=>{const p=state.people.get(id);return String(p.first||p.name.split(/s+/)[0]).toLowerCase()===t;});if(byFirst.length===1)pid=byFirst[0];}
  if(!pid){
    const parts=typed.split(/s+/);pid=newId();
    put("people",pid,{name:typed,first:parts[0],last:parts.length>1?parts.slice(1).join(" "):"",created:Date.now()});
    toast(typed+" wasn't on the list, so they've been added as a new member.");
  }
  doDrop({pid,from:"list",cid:null},{kind:"proposed",cid});
}
function cancelEdit(){state.editing=null;render();}
function startEdit(ed,sel){state.editing=ed;render();const i=$(sel);if(i){i.focus();i.select&&i.select();}}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){
    const act=a.dataset.act,cid=a.dataset.cid;
    switch(act){
      case"clear":patchCalling(cid,{proposed:null,release:false,status:null});return;
      case"release":patchCalling(cid,{release:true,proposed:null,status:"proposed"});return;
      case"status":{const c=state.callings.get(cid);const i=STATUSES.findIndex(s=>s[0]===(c.status||"proposed"));patchCalling(cid,{status:STATUSES[(i+1)%STATUSES.length][0]});return;}
      case"apply":recordCalling(cid);return;
      case"record-all":for(const[id,c]of state.callings)if(isPending(c)&&c.status==="setapart")recordCalling(id);toast("Recorded. Remember to update the calling in LCR.");return;
      case"mark-sustained":for(const[id,c]of state.callings)if(isPending(c)&&c.status==="accepted")patchCalling(id,{status:"sustained"});return;
      case"copy":{const ta=$("#script");const txt=ta.value;const done=()=>toast("Sustaining script copied.");const fb=()=>{ta.focus();ta.select();toast("Press Ctrl+C (or ⌘C) to copy the selected script.");};try{navigator.clipboard.writeText(txt).then(done,fb);}catch(err){fb();}return;}
      case"goto":{state.flash=cid;if(state.view==="vacant")state.view="all";const gc=state.callings.get(cid);if(gc&&state.collapsed.delete(gc.org))saveCollapsed();render();return;}
      case"type-name":if(state.selected){doDrop(state.selected,{kind:"proposed",cid});state.selected=null;render();return;}startEdit({type:"propose",id:cid},"#edit-propose");return;
      case"edit-calling":startEdit({type:"calling",id:cid},"#edit-calling");return;
      case"add-calling":startEdit({type:"new",org:a.dataset.org},"#edit-new");return;
      case"save":commitEdit();return;
      case"cancel":cancelEdit();return;
      case"del-calling":arm(a,"Confirm delete",()=>{state.editing=null;put("callings",cid,null);render();});return;
      case"rename-person":startEdit({type:"person",id:a.dataset.pid},"#edit-person");return;
      case"del-person":arm(a,"Confirm",()=>{removePerson(a.dataset.pid);render();});return;
      case"del-samples":arm(a,"Confirm remove",()=>{for(const[id,p]of[...state.people])if(p.sample)removePerson(id);render();});return;
      case"copy-data":{const txt=exportData();try{navigator.clipboard.writeText(txt).then(()=>toast("Board data copied. Paste it into the new board."),()=>fallbackCopy(txt));}catch(err){fallbackCopy(txt);}return;}
      case"import":{const ta=document.getElementById("importText");if(ta&&importData(ta.value))ta.value="";return;}
      case"template":addTemplate();return;
      case"toggle-org":{const o=a.dataset.org;state.collapsed.has(o)?state.collapsed.delete(o):state.collapsed.add(o);saveCollapsed();render();return;}
      case"expand-all":state.collapsed.clear();saveCollapsed();render();return;
      case"collapse-all":for(const c of state.callings.values())state.collapsed.add(c.org);saveCollapsed();render();return;
      case"unpick":state.selected=null;render();return;
    }
  }
  // tap-to-place onto a slot
  if(state.selected&&!e.target.closest("[data-drag],button,input,textarea")){
    const slot=e.target.closest("[data-drop]");
    if(slot){doDrop(state.selected,{kind:slot.dataset.drop,cid:slot.dataset.cid});state.selected=null;render();}
  }
});
// keep focus in edit inputs when pressing their buttons
document.addEventListener("pointerdown",e=>{if(e.target.closest(".edit button"))e.preventDefault();},true);
document.addEventListener("focusout",e=>{
  if(e.target.matches("#edit-calling,#edit-person,#edit-new,#edit-propose")){setTimeout(()=>{if(state.editing&&!document.activeElement?.closest?.(".edit"))commitEdit();},0);}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("#edit-calling,#edit-person,#edit-new,#edit-propose")){if(e.key==="Enter"){e.preventDefault();commitEdit();}else if(e.key==="Escape")cancelEdit();return;}
  if(e.key==="Escape"&&state.selected){state.selected=null;render();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-drag]")){e.preventDefault();tapChip(srcOf(e.target),e.target);}
  if(e.key==="Enter"&&e.target.matches(".citem")){e.target.click();}
});
$("#viewSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){state.view=b.dataset.view;render();}});
$("#pSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){state.pf=b.dataset.pf;render();}});
$("#q").addEventListener("input",e=>{state.q=e.target.value;renderBoard(index());});
$("#pq").addEventListener("input",e=>{state.pq=e.target.value;renderPeople(index());});
$("#addPeople").addEventListener("submit",e=>{
  e.preventDefault();const ta=$("#newNames");
  const names=ta.value.split(/\n|;/).map(s=>s.trim()).filter(Boolean);
  const existing=new Set([...state.people.values()].map(p=>p.name.toLowerCase()));
  let n=0;for(const nm of names){if(existing.has(nm.toLowerCase()))continue;existing.add(nm.toLowerCase());put("people",newId(),{name:nm,created:Date.now()});n++;}
  ta.value="";if(names.length)toast(n?`Added ${n} ${n===1?"member":"members"}.`:"Those names are already on the list.");render();
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="newOrg")return;e.preventDefault();
  const org=$("#newOrgName").value.trim(),first=$("#newOrgFirst").value.trim();
  if(!org||!first){toast("Enter an organization name and its first calling.");return;}
  const maxO=Math.max(0,...[...state.callings.values()].map(c=>c.orgOrder??0));
  put("callings",newId(),{title:first,org,orgOrder:maxO+1,order:0,current:null,proposed:null,release:false,status:null,updated:Date.now()});render();
});

function fallbackCopy(txt){const t=document.createElement("textarea");t.value=txt;t.className="script";t.readOnly=true;t.style.minHeight="120px";const p=document.querySelector(".backup");p.after(t);t.focus();t.select();toast("Press Ctrl+C (or ⌘C) to copy the selected data.");}
/* ---------- drag & drop (pointer events: mouse, pen, touch long-press) ---------- */
let drag=null,over=null,scrollRaf=0;
const ghost=$("#ghost");
const srcOf=el=>({pid:el.dataset.pid,from:el.dataset.from,cid:el.dataset.cid||null});
function tapChip(src,el){
  if(state.readOnly)return;
  if(state.selected&&!sameSrc(state.selected,src)&&src.from!=="list"){
    const slot=el.closest("[data-drop]");
    if(slot){const s=state.selected;state.selected=null;doDrop(s,{kind:slot.dataset.drop,cid:slot.dataset.cid});render();return;}
  }
  state.selected=sameSrc(state.selected,src)?null:src;render();
}
document.addEventListener("pointerdown",e=>{
  if(state.readOnly||e.button!==0)return;
  const el=e.target.closest("[data-drag]");
  if(!el||e.target.closest("button,input"))return;
  drag={el,src:srcOf(el),x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,id:e.pointerId,active:false,touch:e.pointerType==="touch",timer:0};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.active)startDrag();},260);
  else e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  drag.px=e.clientX;drag.py=e.clientY;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    if(drag.touch){clearTimeout(drag.timer);drag=null;return;} // user is scrolling
    startDrag();
  }
  moveGhost();hover();
});
document.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  clearTimeout(drag.timer);const d=drag;drag=null;
  if(d.active){const t=targetAt(e.clientX,e.clientY);endDrag();if(t)doDrop(d.src,{kind:t.dataset.drop,cid:t.dataset.cid});render();}
  else tapChip(d.src,d.el);
});
document.addEventListener("pointercancel",()=>{if(drag){clearTimeout(drag.timer);if(drag.active)endDrag();drag=null;}});
document.addEventListener("touchmove",e=>{if(drag&&drag.active)e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(drag&&drag.active)e.preventDefault();});
function startDrag(){
  drag.active=true;state.selected=null;renderPickbar();document.body.classList.remove("picking");
  ghost.textContent=nameOf(drag.src.pid);ghost.hidden=false;moveGhost();
  document.body.classList.add("dragging");drag.el.classList.add("src");
  if(navigator.vibrate&&drag.touch)try{navigator.vibrate(12);}catch(e){}
  const tick=()=>{if(!drag||!drag.active)return;const m=70,y=drag.py;
    if(y<m+60)window.scrollBy(0,-Math.ceil((m+60-y)/6));else if(y>innerHeight-m)window.scrollBy(0,Math.ceil((y-(innerHeight-m))/6));
    const pl=$("#plist").getBoundingClientRect();if(drag.px>=pl.left&&drag.px<=pl.right){if(y<pl.top+30&&y>pl.top-10)$("#plist").scrollTop-=8;else if(y>pl.bottom-30&&y<pl.bottom+10)$("#plist").scrollTop+=8;}
    hover();scrollRaf=requestAnimationFrame(tick);};
  scrollRaf=requestAnimationFrame(tick);
}
function moveGhost(){ghost.style.left=drag.px+"px";ghost.style.top=drag.py+"px";}
function targetAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest("[data-drop]"):null;}
function hover(){const t=targetAt(drag.px,drag.py);if(t!==over){over&&over.classList.remove("over");over=t;over&&over.classList.add("over");}}
function endDrag(){cancelAnimationFrame(scrollRaf);ghost.hidden=true;document.body.classList.remove("dragging");over&&over.classList.remove("over");over=null;document.querySelectorAll(".chip.src").forEach(c=>c.classList.remove("src"));}

/* ---------- boot ---------- */
render();
pin=getPin();
if(!pin){state.mode="shared";showGate();}
else loadAll().catch(err=>{if(err&&(err.code==="pin"||err.code==="locked"))apiFailed(err);else{toast("Can't reach the board. Check your connection, then reload.");}});
})();
</script>
</body>
